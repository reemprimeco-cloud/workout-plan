<!doctype html>
<html lang="en">

  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>Prime Fit — Workout Tracker by Prime Printing Co.</title>

    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />

    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />

    <!-- Apple Touch Icon (iOS "Add to Home Screen") -->
    <link rel="apple-touch-icon" sizes="180x180" href="/manus-storage/apple-touch-icon_e6fe2cf5.png" />

    <!-- iOS PWA meta tags -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Prime Fit" />

    <!-- Android / Chrome PWA -->
    <meta name="theme-color" content="#1B2E5E" />
    <meta name="mobile-web-app-capable" content="yes" />

    <meta name="description" content="Prime Fit — برنامج تمارين 8 أسابيع مع تتبع الوزن والإحصائيات. by Prime Printing Co." />
    <meta property="og:title" content="Prime Fit — Workout Tracker" />
    <meta property="og:description" content="برنامج تمارين 8 أسابيع مع تتبع الوزن والإحصائيات" />
    <meta property="og:image" content="/manus-storage/logo512_95cc3580.png" />
    <meta property="og:type" content="website" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script
      defer
      src="%VITE_ANALYTICS_ENDPOINT%/umami"
      data-website-id="%VITE_ANALYTICS_WEBSITE_ID%"></script>
  </body>

</html>
